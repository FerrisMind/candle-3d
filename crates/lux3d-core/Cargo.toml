[package]
name = "lux3d-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Core CUDA-first inference runtime, contracts, and export tooling for Pi3, Pi3X, and TripoSR."
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
vision-preproc = ["dep:mistralrs-vision"]
cuda = ["candle-core/cuda", "candle-nn/cuda"]
metal = ["candle-core/metal", "candle-nn/metal"]
wgpu = ["candle-core/wgpu", "candle-nn/wgpu"]
vulkan = ["candle-core/vulkan", "candle-nn/vulkan"]

[dependencies]
anyhow.workspace = true
dirs.workspace = true
fs2.workspace = true
hf-hub.workspace = true
image.workspace = true
nalgebra.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
mistralrs-vision = { version = "0.8.1", optional = true }
mcubes.workspace = true
lin_alg.workspace = true
ndarray.workspace = true
ndarray-npy.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { workspace = true, features = ["cuda"] }
candle-nn = { workspace = true, features = ["cuda"] }
