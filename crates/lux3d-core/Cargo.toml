[package]
name = "lux3d-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Core CUDA-first inference runtime, contracts, and export tooling for Pi3, Pi3X, and TripoSR."
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
vision-preproc = ["dep:mistralrs-vision"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
wgpu = ["candle-core/wgpu", "candle-nn/wgpu", "candle-transformers/wgpu"]
vulkan = ["candle-core/vulkan", "candle-nn/vulkan", "candle-transformers/vulkan"]

[dependencies]
anyhow.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
dirs.workspace = true
fs2.workspace = true
hf-hub.workspace = true
image.workspace = true
nalgebra.workspace = true
safetensors.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
mistralrs-vision = { version = "0.8.1", optional = true }
mcubes.workspace = true
isomesh.workspace = true
lin_alg.workspace = true
ndarray.workspace = true
ndarray-npy.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
tracing = "0.1.37"
tracing-chrome = "0.7.1"
tracing-subscriber = "0.3.7"

[[bench]]
name = "bench_main"
harness = false
