name: "Determine tag name"
description: "Resolve the release tag used in asset filenames (llama.cpp style)."
inputs:
  version:
    description: "Optional explicit version/tag (e.g. v0.1.0 or b123). Empty → derive from git."
    required: false
    default: ""
outputs:
  name:
    description: "Tag string embedded in release asset names"
    value: ${{ steps.tag.outputs.name }}

runs:
  using: "composite"
  steps:
    - name: Determine tag name
      id: tag
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        if [[ "$REF_TYPE" == "tag" ]]; then
          NAME="$REF_NAME"
        elif [[ -n "$INPUT_VERSION" ]]; then
          NAME="$INPUT_VERSION"
        else
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          NAME="b${BUILD_NUMBER}"
        fi
        echo "name=${NAME}" >> "$GITHUB_OUTPUT"
        echo "Release tag for assets: ${NAME}"
